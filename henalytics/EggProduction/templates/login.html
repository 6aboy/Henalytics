{% extends 'base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'EggProduction/css/login.css' %}">

<div class="login-bg d-flex align-items-center justify-content-center">
    <div class="card login-card shadow-sm">
        <div class="card-body text-center">
            <img src="{% static 'EggProduction/img/logo-blue-ver.png' %}" alt="Henalytics" class="mb-3 logo-img">
            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                {% include 'egg_production/includes/form_errors.html' %}
                <div class="mb-3 text-start form-group">
                    <label class="form-label">Username</label>
                    <input name="username" value="{{ form.username.value|default_if_none:'' }}"
                        class="form-control" required autofocus>
                    {% for err in form.username.errors %}
                    <small class="form-error">{{ err }}</small>
                    {% endfor %}
                </div>
                <div class="mb-3 text-start form-group">
                    <label class="form-label">Password</label>
                    <input name="password" type="password"
                        class="form-control" required>
                    {% for err in form.password.errors %}
                    <small class="form-error">{{ err }}</small>
                    {% endfor %}
                </div>
                <button class="btn btn-primary w-50">Login</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
