{% extends 'base.html' %}

{% block title %}Delete Confirmation - Henalytics{% endblock %}

{% block content %}
<div class="container mt-4 action-page">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-danger action-panel">
                <div class="card-header bg-danger text-white">Delete Confirmation</div>
                <div class="card-body">
                    <h5>Are you sure you want to delete this item?</h5>
                    <p class="text-danger"><strong>Warning:</strong> This action cannot be undone.</p>
                    <form method="post" data-swal-delete
                        data-swal-title="Delete production record?"
                        data-swal-text="This production record will be permanently deleted.">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Delete</button>
                        <a href="javascript:history.back()" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
