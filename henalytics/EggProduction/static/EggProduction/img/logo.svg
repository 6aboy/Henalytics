<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feFlood flood-color="#eef6ff" flood-opacity="0.95" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glowBlur"/>
      <feMerge>
        <feMergeNode in="glowBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <g stroke="#1947b3" stroke-width="7" stroke-linejoin="round">
      <rect x="22" y="20" width="46" height="225" rx="8" fill="#3060d6"/>
      <rect x="98" y="20" width="46" height="225" rx="8" fill="#3060d6"/>
    </g>

    <g stroke="#1947b3" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
      <path d="M 22 140
               L 300 140
               L 300 118
               L 420 152
               L 300 186
               L 300 164
               L 22 164
               Z" fill="#39cf6f"/>
      <path d="M 405 158
               L 470 100
               L 445 95
               L 540 65
               L 525 165
               L 500 145
               L 460 178
               Z" fill="#39cf6f"/>
    </g>

    <text x="168" y="262" font-family="Arial, Helvetica, sans-serif" font-weight="800"
          font-size="96" fill="#3060d6" stroke="#1947b3" stroke-width="3.5"
          letter-spacing="-1">ENalytics</text>
