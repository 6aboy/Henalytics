<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .bg { fill: #f4f7fb; }
      .system { fill: #f8fbff; stroke: #2f5fd0; stroke-width: 3; }
      .title { font: 800 28px Arial, sans-serif; fill: #2f5fd0; }
      .actor-label { font: 700 18px Arial, sans-serif; fill: #102a43; text-anchor: middle; }
      .usecase { fill: #ffffff; stroke: #2f5fd0; stroke-width: 2; }
      .usecase-soft { fill: #eaf1ff; stroke: #2f5fd0; stroke-width: 2; }
      .usecase-green { fill: #eafff1; stroke: #20c768; stroke-width: 2; }
      .usecase-yellow { fill: #fff8e8; stroke: #f2a900; stroke-width: 2; }
      .usecase-red { fill: #fff1f1; stroke: #ef4444; stroke-width: 2; }
      .text { font: 700 15px Arial, sans-serif; fill: #102a43; text-anchor: middle; }
      .small { font: 600 13px Arial, sans-serif; fill: #526274; text-anchor: middle; }
      .note { fill: #ffffff; stroke: #b8c7ea; stroke-width: 1.5; }
      .note-text { font: 600 13px Arial, sans-serif; fill: #526274; }
      .line { stroke: #2f5fd0; stroke-width: 2.5; fill: none; }
      .line-muted { stroke: #6b7a90; stroke-width: 2; fill: none; }
      .line-green { stroke: #20c768; stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
      .line-yellow { stroke: #f2a900; stroke-width: 2.5; fill: none; }
      .line-red { stroke: #ef4444; stroke-width: 2.5; fill: none; }
    </style>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f5fd0" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#20c768" />
    </marker>
  </defs>

  <rect class="bg" width="1400" height="900" />
  <rect class="system" x="255" y="80" width="910" height="715" rx="18" />
  <text class="title" x="710" y="120" text-anchor="middle">HENalytics Web System</text>

  <g id="staff-actor" transform="translate(105 265)">
    <circle cx="0" cy="18" r="16" fill="none" stroke="#102a43" stroke-width="3" />
    <line x1="0" y1="34" x2="0" y2="78" stroke="#102a43" stroke-width="3" />
    <line x1="-34" y1="50" x2="34" y2="50" stroke="#102a43" stroke-width="3" />
    <line x1="0" y1="78" x2="-28" y2="116" stroke="#102a43" stroke-width="3" />
    <line x1="0" y1="78" x2="28" y2="116" stroke="#102a43" stroke-width="3" />
    <text class="actor-label" x="0" y="148">Staff</text>
  </g>

  <g id="admin-actor" transform="translate(1270 225)">
    <circle cx="0" cy="18" r="16" fill="none" stroke="#102a43" stroke-width="3" />
    <line x1="0" y1="34" x2="0" y2="78" stroke="#102a43" stroke-width="3" />
    <line x1="-34" y1="50" x2="34" y2="50" stroke="#102a43" stroke-width="3" />
    <line x1="0" y1="78" x2="-28" y2="116" stroke="#102a43" stroke-width="3" />
    <line x1="0" y1="78" x2="28" y2="116" stroke="#102a43" stroke-width="3" />
    <text class="actor-label" x="0" y="148">Administrator</text>
  </g>

  <g id="dev-actor" transform="translate(1270 610)">
    <circle cx="0" cy="18" r="16" fill="none" stroke="#102a43" stroke-width="3" />
    <line x1="0" y1="34" x2="0" y2="78" stroke="#102a43" stroke-width="3" />
    <line x1="-34" y1="50" x2="34" y2="50" stroke="#102a43" stroke-width="3" />
    <line x1="0" y1="78" x2="-28" y2="116" stroke="#102a43" stroke-width="3" />
    <line x1="0" y1="78" x2="28" y2="116" stroke="#102a43" stroke-width="3" />
    <text class="actor-label" x="0" y="148">Developer / Superuser</text>
  </g>

  <ellipse class="usecase-soft" cx="712" cy="165" rx="103" ry="30" />
  <text class="text" x="712" y="171">Login / Authenticate</text>

  <rect class="note" x="310" y="205" width="290" height="42" rx="8" />
  <text class="note-text" x="330" y="231">Staff handles daily operational data entry.</text>
  <rect class="note" x="795" y="205" width="315" height="42" rx="8" />
  <text class="note-text" x="815" y="223">Administrator reviews data, exports reports,</text>
  <text class="note-text" x="815" y="239">and runs forecasting.</text>

  <ellipse class="usecase" cx="460" cy="329" rx="130" ry="39" />
  <text class="text" x="460" y="322">Manage Flock Records</text>
  <text class="small" x="460" y="342">Create, Read, Update, Delete</text>

  <ellipse class="usecase" cx="460" cy="434" rx="130" ry="39" />
  <text class="text" x="460" y="427">Manage Egg Production Logs</text>
  <text class="small" x="460" y="447">Create, Read, Update, Delete</text>

  <ellipse class="usecase" cx="460" cy="539" rx="130" ry="39" />
  <text class="text" x="460" y="532">Manage Sales Transactions</text>
  <text class="small" x="460" y="552">Create, Read, Update, Delete</text>

  <ellipse class="usecase-green" cx="500" cy="656" rx="135" ry="36" />
  <text class="text" x="500" y="649">Calculate Production Metrics</text>
  <text class="small" x="500" y="669">live hens, HEN-day, HEN-housed, FCR</text>

  <ellipse class="usecase" cx="905" cy="330" rx="125" ry="35" />
  <text class="text" x="905" y="336">View Dashboard and Records</text>

  <ellipse class="usecase" cx="905" cy="430" rx="125" ry="35" />
  <text class="text" x="905" y="424">Export Reports</text>
  <text class="small" x="905" y="444">CSV, Excel, PDF, Print</text>

  <ellipse class="usecase" cx="905" cy="530" rx="125" ry="35" />
  <text class="text" x="905" y="536">Generate Egg Forecasts</text>

  <ellipse class="usecase" cx="905" cy="620" rx="125" ry="35" />
  <text class="text" x="905" y="626">Generate Sales Forecasts</text>

  <ellipse class="usecase-soft" cx="730" cy="741" rx="160" ry="31" />
  <text class="text" x="730" y="734">Review Forecast Charts, Tables,</text>
  <text class="small" x="730" y="754">Interpretation Cards, and Validation</text>

  <ellipse class="usecase-yellow" cx="1030" cy="741" rx="110" ry="31" />
  <text class="text" x="1030" y="734">Maintain Forecast Outputs</text>
  <text class="small" x="1030" y="754">Keep Latest Run / Clear All</text>

  <ellipse class="usecase-red" cx="1060" cy="651" rx="80" ry="31" />
  <text class="text" x="1060" y="644">Manage Users</text>
  <text class="small" x="1060" y="664">Django Admin</text>

  <path class="line-muted" d="M145 292 L610 165" />
  <path class="line-muted" d="M1225 250 L815 165" />
  <path class="line-muted" d="M1215 625 L815 170" />

  <path class="line" d="M145 315 L330 329" />
  <path class="line" d="M145 340 L330 434" />
  <path class="line" d="M145 365 L330 539" />
  <path class="line-green" marker-end="url(#arrowGreen)" d="M520 470 L500 620" />

  <path class="line" d="M1225 275 L1030 330" />
  <path class="line" d="M1225 300 L1030 430" />
  <path class="line" d="M1225 325 L1030 530" />
  <path class="line" d="M1225 350 L1030 620" />
  <path class="line" marker-end="url(#arrowBlue)" stroke-dasharray="7 5" d="M850 560 L760 710" />
  <path class="line" marker-end="url(#arrowBlue)" stroke-dasharray="7 5" d="M875 650 L765 710" />
  <path class="line-yellow" d="M1215 640 L1140 741" />
  <path class="line-red" d="M1215 650 L1140 651" />
</svg>
