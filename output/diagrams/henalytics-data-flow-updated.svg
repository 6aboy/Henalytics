  <path class="flow-blue" d="M200 266 H260 V321 H320" />
  <path class="flow-yellow" d="M200 422 H260 V321 H320" />
  <path class="flow-gray" d="M545 191 H675" />
  <path class="flow-blue" d="M550 321 H615 V310 H675" />
  <path class="flow-blue" d="M550 321 H615 V430 H675" />
  <path class="flow-blue" d="M550 321 H615 V550 H675" />
  <path class="flow-green" d="M435 367 V430" />
  <path class="flow-green" d="M550 474 H600 V430 H675" />
  <path class="flow-red" d="M200 775 H330" />
  <path class="flow-red" d="M540 781 H600 V190 H675" />
  <path class="flow-gray" d="M905 310 H965 V288 H1030" />
  <path class="flow-gray" d="M905 430 H950 V288 H1030" />
  <path class="flow-gray" d="M905 550 H965 V288 H1030" />
  <path class="flow-blue" d="M1325 455 H1285 V288 H1254" />
  <path class="flow-blue" d="M1254 330 H1285 V455 H1325" />
  <path class="flow-blue" d="M1325 455 H1285 V498 H1254" />
  <path class="flow-gray" d="M905 430 H950 V498 H1030" />
  <path class="flow-gray" d="M905 550 H950 V498 H1030" />
