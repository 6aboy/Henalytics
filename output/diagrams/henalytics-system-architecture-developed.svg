<svg xmlns="http://www.w3.org/2000/svg" width="900" height="980" viewBox="0 0 900 980" role="img" aria-labelledby="title desc">
  <title id="title">HENalytics Developed System Architecture Diagram</title>
  <desc id="desc">Simple system architecture diagram showing staff and administrator users accessing the HENalytics Django web application through a browser and network, with forecasting, reports, exports, Django ORM, and SQLite database.</desc>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5fd0"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#20c768"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6"/>
    </marker>
    <style>
      .bg { fill: #f4f7fb; }
      .title { fill: #2f5fd0; font: 700 25px Arial, sans-serif; }
      .subtitle { fill: #526274; font: 400 13px Arial, sans-serif; }
      .node { fill: #ffffff; stroke: #9eb6f2; stroke-width: 2; }
      .blue { fill: #eef4ff; stroke: #2f5fd0; stroke-width: 2.5; }
      .green { fill: #ebfff4; stroke: #20c768; stroke-width: 2.5; }
      .purple { fill: #f4efff; stroke: #8b5cf6; stroke-width: 2.5; }
      .gray { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; }
      .label { fill: #102a43; font: 700 15px Arial, sans-serif; }
      .text { fill: #526274; font: 400 12px Arial, sans-serif; }
      .small { fill: #526274; font: 400 11px Arial, sans-serif; }
      .line-blue { fill: none; stroke: #2f5fd0; stroke-width: 2.3; marker-end: url(#arrowBlue); }
      .line-green { fill: none; stroke: #20c768; stroke-width: 2.3; marker-end: url(#arrowGreen); }
      .line-purple { fill: none; stroke: #8b5cf6; stroke-width: 2.3; marker-end: url(#arrowPurple); }
      .icon { fill: none; stroke: #2f5fd0; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .icon-green { fill: none; stroke: #20c768; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .icon-purple { fill: none; stroke: #8b5cf6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="bg" width="900" height="980"/>
  <text class="title" x="450" y="55" text-anchor="middle">HENalytics Developed System Architecture Diagram</text>
  <text class="subtitle" x="450" y="80" text-anchor="middle">Simple web-based architecture for poultry records, reports, and forecasting.</text>

  <rect class="blue" x="145" y="125" width="170" height="95" rx="10"/>
  <circle class="icon" cx="230" cy="153" r="15"/>
  <path class="icon" d="M210 191 C215 174 245 174 250 191"/>
  <text class="label" x="230" y="188" text-anchor="middle">Staff</text>
  <text class="text" x="230" y="207" text-anchor="middle">CRUD records</text>

  <rect class="blue" x="585" y="125" width="170" height="95" rx="10"/>
  <circle class="icon" cx="670" cy="153" r="15"/>
  <path class="icon" d="M650 191 C655 174 685 174 690 191"/>
  <path class="icon" d="M681 143 L693 132 L704 143"/>
  <text class="label" x="670" y="188" text-anchor="middle">Administrator</text>
  <text class="text" x="670" y="207" text-anchor="middle">Reports and forecasts</text>

  <rect class="green" x="340" y="285" width="220" height="100" rx="10"/>
  <rect class="icon-green" x="392" y="312" width="116" height="45" rx="4"/>
  <path class="icon-green" d="M418 369 L482 369"/>
  <text class="label" x="450" y="343" text-anchor="middle">Web Browser</text>
  <text class="text" x="450" y="365" text-anchor="middle">Forms, tables, dashboard, charts</text>

  <rect class="gray" x="360" y="455" width="180" height="80" rx="10"/>
  <path class="icon" d="M415 493 C425 477 475 477 485 493"/>
  <path class="icon" d="M430 493 C438 484 462 484 470 493"/>
  <path class="icon" d="M445 493 C448 490 452 490 455 493"/>
  <text class="label" x="450" y="502" text-anchor="middle">LAN / Internet</text>
  <text class="text" x="450" y="521" text-anchor="middle">HTTP communication</text>

  <rect class="blue" x="315" y="605" width="270" height="125" rx="10"/>
  <path class="icon" d="M405 645 L405 680 L495 680 L495 645 Z"/>
  <path class="icon" d="M405 645 L450 620 L495 645"/>
  <text class="label" x="450" y="655" text-anchor="middle">HENalytics Django App</text>
  <text class="text" x="450" y="680" text-anchor="middle">Authentication, role access, views,</text>
  <text class="text" x="450" y="698" text-anchor="middle">forms, validation, and business logic</text>

  <rect class="purple" x="80" y="610" width="190" height="115" rx="10"/>
  <path class="icon-purple" d="M125 680 L125 640 L235 640"/>
  <path class="icon-purple" d="M137 668 L160 650 L184 660 L222 628"/>
  <text class="label" x="175" y="654" text-anchor="middle">Forecasting</text>
  <text class="text" x="175" y="679" text-anchor="middle">Egg and sales forecasts</text>
  <text class="text" x="175" y="697" text-anchor="middle">with validation metrics</text>

  <rect class="green" x="630" y="610" width="190" height="115" rx="10"/>
  <path class="icon-green" d="M680 665 L770 665"/>
  <path class="icon-green" d="M680 642 L770 642"/>
  <path class="icon-green" d="M680 688 L770 688"/>
  <text class="label" x="725" y="654" text-anchor="middle">Reports / Exports</text>
  <text class="text" x="725" y="679" text-anchor="middle">Dashboard summaries, CSV,</text>
  <text class="text" x="725" y="697" text-anchor="middle">Excel, PDF, and print</text>

  <rect class="green" x="360" y="790" width="180" height="80" rx="10"/>
  <path class="icon-green" d="M410 825 L490 825"/>
  <path class="icon-green" d="M410 845 L490 845"/>
  <path class="icon-green" d="M425 812 L425 858"/>
  <path class="icon-green" d="M475 812 L475 858"/>
  <text class="label" x="450" y="825" text-anchor="middle">Django ORM</text>
  <text class="text" x="450" y="846" text-anchor="middle">Model-based database access</text>

  <path d="M380 895 L520 895 L520 945 L380 945 Z" class="blue"/>
  <path d="M380 895 C380 918 520 918 520 895" fill="none" stroke="#2f5fd0" stroke-width="2.5"/>
  <path d="M380 945 C380 968 520 968 520 945" fill="none" stroke="#2f5fd0" stroke-width="2.5"/>
  <text class="label" x="450" y="926" text-anchor="middle">SQLite Database</text>
  <text class="text" x="450" y="947" text-anchor="middle">Current data storage</text>

  <path class="line-blue" d="M315 172 L395 172 L395 285"/>
  <path class="line-blue" d="M585 172 L505 172 L505 285"/>
  <path class="line-green" d="M450 385 L450 455"/>
  <path class="line-green" d="M450 535 L450 605"/>
  <path class="line-purple" d="M315 668 L270 668"/>
  <path class="line-green" d="M585 668 L630 668"/>
  <path class="line-green" d="M450 730 L450 790"/>
  <path class="line-blue" d="M450 870 L450 895"/>

  <rect class="node" x="130" y="760" width="640" height="42" rx="8"/>
  <text class="small" x="450" y="786" text-anchor="middle">The Django application connects user actions, analytics, reports, forecasts, and stored poultry records in one centralized system.</text>
</svg>
